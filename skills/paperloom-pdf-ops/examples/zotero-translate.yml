schema_version: agent-batch-workflow.v1
name: zotero-translate
description: Translate Zotero PDFs already imported into the PaperLoom library.
inputs:
  sources:
    # Replace this value with a document_id returned by zotero import.
    # Repeat the entry for each selected attachment.
    - kind: document_id
      value: REPLACE_WITH_IMPORTED_DOCUMENT_ID
steps:
  - id: translate
    action: translate
execution:
  dry_run: true
  max_items: 50
  concurrency: 2
  failure_policy: continue
writeback:
  zotero: false
  obsidian: false
  conflict_policy: ask
